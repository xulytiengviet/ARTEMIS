name: Triển khai trang ARTEMIS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Đưa bản mô phỏng lên GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
      - name: Tải gói trang web
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Triển khai trang
        id: deployment
        uses: actions/deploy-pages@v4
